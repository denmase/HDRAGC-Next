name: build

on:
  push:
    branches: [ main ]
  pull_request:

env:
  AVS_VERSION: v3.7.5

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build AvsCore, build the dual-interface plugin, run the full
  # T1-T17 suite (incl. real-frame T16) through the C API test host.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Fetch AviSynth+ source
        run: |
          curl -sL --retry 3 -o avs.tar.gz \
            https://codeload.github.com/AviSynth/AviSynthPlus/tar.gz/refs/tags/${{ env.AVS_VERSION }}
          mkdir -p avs
          tar xzf avs.tar.gz -C avs --strip-components=1

      - name: Cache AviSynth+ core build
        id: cache-avs
        uses: actions/cache@v4
        with:
          path: avsbuild
          key: avs-${{ env.AVS_VERSION }}-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build AvsCore
        if: steps.cache-avs.outputs.cache-hit != 'true'
        run: |
          cmake -S avs -B avsbuild -GNinja -DCMAKE_BUILD_TYPE=Release
          ninja -C avsbuild AvsCore

      - name: Build plugin (dual-interface: AVS + VS in one binary)
        run: |
          cmake -S . -B pbuild -GNinja \
            -DAVISYNTH_INCLUDE_DIR="$PWD/avs/avs_core/include"
          ninja -C pbuild

      - name: Build test host
        run: |
          gcc -O1 -o host test/host.c \
            -I avs/avs_core/include \
            -L avsbuild/avs_core -lavisynth -lm

      - name: Run test suite (T1-T17)
        run: LD_LIBRARY_PATH="$PWD/avsbuild/avs_core" ./host pbuild/hdragc_next.so

      - name: Upload dual-interface artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdragc-next-linux-x86_64
          path: pbuild/hdragc_next.so

  # ---------------------------------------------------------------------------
  # Windows: MSVC static-runtime build; runtime smoke test of BOTH interfaces.
  # ---------------------------------------------------------------------------
  windows:
    # PIN windows-2022: windows-latest no longer ships VS2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AviSynth+ headers
        run: |
          curl.exe -sL --retry 3 -o avs.tar.gz `
            https://codeload.github.com/AviSynth/AviSynthPlus/tar.gz/refs/tags/${{ env.AVS_VERSION }}
          mkdir avs
          tar xzf avs.tar.gz -C avs --strip-components=1

      - name: Build plugin (MSVC, static runtime, dual-interface)
        run: |
          cmake -S . -B pbuild -G "Visual Studio 17 2022" -A x64 `
            -DAVISYNTH_INCLUDE_DIR="$PWD/avs/avs_core/include"
          cmake --build pbuild --config Release

      - name: Verify static dependencies (no vcruntime/msvcp/libstdc++)
        run: |
          $dll = "pbuild/Release/hdragc_next.dll"
          $deps = (& "$env:VSAPPIDDIR\..\..\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\dumpbin.exe" /dependents $dll) -join " "
          if ($deps -match "vcruntime140|msvcp140|libstdc\+\+|libgcc") {
            Write-Error "Non-static dependency found: $deps"; exit 1
          }
          Write-Output "Static deps OK"

      - name: VapourSynth runtime smoke test
        run: |
          pip install vapoursynth
          python - <<'PY'
          import vapoursynth as vs
          core = vs.core
          core.std.LoadPlugin(path='pbuild/Release/hdragc_next.dll')
          assert 'HDRAGCNext' in dir(core.hlgef)
          for fmt in (vs.YUV420P8, vs.YUV420P16, vs.YUV444P16):
              src = core.std.BlankClip(width=64, height=64, length=3, format=fmt)
              pas = core.hlgef.HDRAGCNext(src, gain=0.0)
              d = core.std.PlaneStats(core.std.Expr([src, pas], 'x y - abs'))
              assert d.get_frame(0).props['PlaneStatsMax'] == 0.0, fmt
          try:
              core.hlgef.HDRAGCNext(core.std.BlankClip(format=vs.RGB24)).get_frame(0)
              raise SystemExit('RGB24 NOT rejected')
          except Exception:
              pass
          print('PASS: VS smoke test (windows, static dll)')
          PY

      - name: Upload dual-interface artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdragc-next-windows-x64
          path: pbuild/Release/hdragc_next.dll